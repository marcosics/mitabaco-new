<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiTabaco</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">MiTabaco</h1>
    <p class="subtitle">Precios oficiales · Actualizado <span id="last-updated">...</span></p>
  </header>

  <!-- HOME -->
  <main id="page-home">
    <div id="favs" class="hidden"></div>
    <div id="search-area">
      <input type="text" id="search" placeholder="Buscar por marca...">
      <select id="filter">
        <option value="all">Todos</option>
        <option value="cigarrillos">Cigarrillos</option>
        <option value="tabaco-liar">Liar</option>
        <option value="puros">Puros</option>
        <option value="tabaco-pipa">Pipa</option>
        <option value="otros">Otros</option>
      </select>
    </div>
    <div id="list"></div>
  </main>

  <!-- FAVORITES VIEW -->
  <main id="page-favs" class="hidden">
    <div class="empty" id="fav-empty">Sin favoritos todavía</div>
    <div id="fav-list"></div>
  </main>

  <!-- DETAIL -->
  <div id="detail" class="hidden"></div>

  <!-- BOTTOM NAV -->
  <nav>
    <button id="nav-home" class="active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Buscar</span>
    </button>
    <button id="nav-favs">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Favoritos</span>
    </button>
  </nav>

  <div id="toast" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
