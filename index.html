<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiTabaco</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>MiTabaco</h1>
    <p class="subtitle">Precios oficiales · Actualizado <span id="last-updated">...</span></p>
  </header>

  <main>
    <div id="favs" class="hidden"></div>

    <div id="search-area">
      <input type="text" id="search" placeholder="Buscar marca...">
      <select id="filter">
        <option value="all">Todos</option>
        <option value="cigarrillos">Cigarrillos</option>
        <option value="tabaco-liar">Tabaco de liar</option>
        <option value="puros">Puros</option>
        <option value="tabaco-pipa">Pipa</option>
        <option value="otros">Otros</option>
      </select>
    </div>

    <div id="list"></div>
  </main>

  <div id="detail" class="hidden">
    <button id="back">←</button>
    <div id="detail-inner"></div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
