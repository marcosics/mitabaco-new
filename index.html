<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiTabaco</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="page-title">MiTabaco</h1>
    <p class="subtitle">Última actualización: <span id="last-updated">...</span></p>
    <div id="search-bar" class="hidden">
      <input type="text" id="search-input" placeholder="Buscar tabaco...">
    </div>
  </header>

  <main>
    <!-- HOME: filters + product list -->
    <section id="view-home">
      <div id="filters">
        <div class="filter-group">
          <label for="filter-type">Tipo</label>
          <select id="filter-type">
            <option value="all">Todos</option>
            <option value="cigarrillos">Cigarrillos</option>
            <option value="tabaco-liar">Tabaco de liar</option>
            <option value="puros">Puros</option>
            <option value="tabaco-pipa">Tabaco de pipa</option>
            <option value="otros">Otros</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-zone">Zona</label>
          <select id="filter-zone">
            <option value="all">Todas</option>
            <option value="nacional">Nacional</option>
            <option value="ceuta-melilla">Ceuta y Melilla</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-price">Precio máx: <span id="price-val">100€</span></label>
          <input type="range" id="filter-price" min="0" max="100" step="0.5" value="100">
        </div>
      </div>
      <div id="product-list"></div>
    </section>

    <!-- FAVORITES -->
    <section id="view-favorites" class="hidden">
      <p id="fav-empty" class="hidden">No tienes favoritos aún.</p>
      <div id="favorites-list"></div>
    </section>

    <!-- SEARCH -->
    <section id="view-search" class="hidden">
      <div id="search-list"></div>
    </section>

    <!-- DETAIL (product page with image upload) -->
    <section id="view-detail" class="hidden">
      <button id="back-btn" class="back-btn">← Volver</button>
      <div id="detail-content"></div>
    </section>
  </main>

  <nav>
    <button id="nav-home" class="active" data-view="home">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </button>
    <button id="nav-search" data-view="search">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Buscar</span>
    </button>
    <button id="nav-favorites" data-view="favorites">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Favoritos</span>
    </button>
  </nav>

  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
