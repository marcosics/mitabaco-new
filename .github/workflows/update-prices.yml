name: Update Prices

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 10:00 AM CET (8:00 AM UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright pywebpush
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/scraper.py

      - name: Check for changes
        run: |
          git add tabaco.csv data/price-changes.json
          git diff --staged --quiet || echo "HAS_CHANGES=true" >> $GITHUB_ENV

      - name: Send push notifications
        if: env.HAS_CHANGES == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/notify.py

      - name: Commit and push
        if: env.HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update tobacco prices"
          git push

      - name: Trigger Pages deploy
        if: env.HAS_CHANGES == 'true'
        run: gh workflow run "Deploy GitHub Pages" --ref main
